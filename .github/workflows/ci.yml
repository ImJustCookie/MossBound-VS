name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  VS_VERSION: "1.22.0" # the game the mod builds against: keep in step with modinfo.json
  DOTNET_NOLOGO: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The mod builds against the game's DLLs. The free dedicated server has them; they are
      # proprietary, so they are downloaded here and never committed.
      - name: Cache the game server
        uses: actions/cache@v4
        with:
          path: vs_server
          key: vs-server-${{ env.VS_VERSION }}

      - name: Download the game server
        run: |
          if [ ! -f vs_server/VintagestoryAPI.dll ]; then
            mkdir -p vs_server
            curl -fsSL "https://cdn.vintagestory.at/gamefiles/stable/vs_server_linux-x64_${VS_VERSION}.tar.gz" | tar -xz -C vs_server
          fi
          echo "VINTAGE_STORY=$PWD/vs_server" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore mossbound.sln

      - name: Lint (formatting and style, see .editorconfig)
        run: dotnet format mossbound.sln --no-restore --verify-no-changes

      - name: Build (warnings fail the build)
        run: dotnet build mossbound.Tests --no-restore -c Release -warnaserror

      - name: Test
        run: dotnet test mossbound.Tests --no-build -c Release --logger "console;verbosity=normal"

      - name: Package
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: mossbound
          path: Releases/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: mossbound

      - name: Check the tag matches modinfo.json
        run: |
          version=$(jq -r .version mossbound/modinfo.json)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but modinfo.json says $version"; exit 1; }

      - name: Publish a draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" *.zip --draft --generate-notes
