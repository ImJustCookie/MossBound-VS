# Install once: `pipx install pre-commit && pre-commit install --install-hooks -t pre-commit -t pre-push`
# Run on everything: `pre-commit run --all-files`
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: local
    hooks:
      # Same check as CI. `dotnet format mossbound.sln` fixes most of what it reports.
      - id: dotnet-format
        name: dotnet format (verify)
        entry: dotnet format mossbound.sln --verify-no-changes
        language: system
        types: [c#]
        pass_filenames: false

      # Tests take a few seconds, so they run before a push rather than every commit.
      - id: dotnet-test
        name: dotnet test
        entry: dotnet test mossbound.Tests
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
